name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compact-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: midnight-contract/package-lock.json

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Pin Compact compiler 0.31.1
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          compact --version
          compact compile --version

      - name: Install contract package
        working-directory: midnight-contract
        run: npm ci

      - name: Diagnose environment
        working-directory: midnight-contract
        run: |
          node -v
          npm -v
          npx vitest --version
          ls -la test/
          ls -la vitest.config.* || true

      - name: Run Vitest
        working-directory: midnight-contract
        run: |
          set +e
          npx vitest run --reporter=verbose > vitest.log 2>&1
          CODE=$?
          cat vitest.log
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Vitest failed::$(tail -c 1800 vitest.log | tr '\n' ' ')"
            echo '## Vitest failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat vitest.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$CODE"

      - name: Compile Compact
        working-directory: midnight-contract
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          npm run compact

      - name: Re-run Vitest after compile
        working-directory: midnight-contract
        run: npm test

      - name: Verify managed keys + contracts path
        run: |
          test -f midnight-contract/managed/casino/keys/placeBet.prover
          test -f midnight-contract/managed/casino/keys/settleWheel.prover
          test -f midnight-contract/managed/casino/keys/commitHouseSeed.prover
          test -f midnight-contract/managed/casino/keys/verifyRoundOwnership.prover
          test -f contracts/casino.compact
          echo "managed/ + contracts/casino.compact OK"
